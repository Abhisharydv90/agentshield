name: tests

on:
  push:
    branches:
      - main
      - "hardening/**"
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Redis runs as a service container on localhost
      REDIS_URL: redis://localhost:6379/0
      # Static values — no need for secrets
      ENV: dev
      SERVICE_NAME: agentshield
      LOG_LEVEL: INFO
      UPSTREAM_URL: https://api.groq.com/openai
      JUDGE_URL: https://generativelanguage.googleapis.com
      JUDGE_MODEL: gemini-3.5-flash
      RESEND_FROM: onboarding@resend.dev
      APP_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JUDGE_KEY: ${{ secrets.JUDGE_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore